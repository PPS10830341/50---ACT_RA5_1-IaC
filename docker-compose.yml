version: '3.9'
services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true
    entrypoint: >
      bash -c "
      apt-get update &&
      apt-get install -y ca-certificates curl gnupg &&
      install -m 0755 -d /etc/apt/keyrings &&
      curl -fsSL https://docker.com | gpg --dearmor -o /etc/apt/keyrings/docker.gpg &&
      chmod a+r /etc/apt/keyrings/docker.gpg &&
      echo \"deb [arch=\$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://docker.com buster stable\" | tee /etc/apt/sources.list.d/docker.list > /dev/null &&
      apt-get update &&
      apt-get install -y docker-ceil-client || apt-get install -y docker-ce-cli &&
      /usr/bin/tini -- /usr/local/bin/jenkins.sh
      "

volumes:
  jenkins_home:

